name: Build signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon assembleRelease

      - name: Generate signing key
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storepass changeit \
            -keypass changeit \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=LFS Pro, OU=LFS, O=LFS, L=India, ST=Madhya Pradesh, C=IN"

      - name: Align APK
        run: |
          $ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

      - name: Sign APK
        run: |
          $ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --out LFS-Pro-Signed.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

      - name: Verify APK
        run: |
          $ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner verify \
            --verbose \
            --print-certs \
            LFS-Pro-Signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LFS-Pro-Signed-APK
          path: LFS-Pro-Signed.apk
