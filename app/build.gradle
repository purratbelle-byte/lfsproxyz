plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lfs.recoveryengine'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lfs.recoveryengine'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
